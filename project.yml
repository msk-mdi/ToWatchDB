name: ToWatchDB
options:
  bundleIdPrefix: com.mehdi
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3.2"
    CURRENT_PROJECT_VERSION: "9"
packages:
  ToWatchCore:
    path: Packages/ToWatchCore
targets:
  ToWatchDB:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: ToWatchDB
    dependencies:
      - package: ToWatchCore
    info:
      path: ToWatchDB/Info.plist
      properties:
        CFBundleDisplayName: ToWatchDB
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        TMDBReadToken: $(TMDB_READ_TOKEN)
        DropboxAppKey: $(DROPBOX_APP_KEY)
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: Save your Year in Review card to your photo library.
        # A Seerr server on the home network is usually plain http (http://192.168.1.10:5055).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connect to your Seerr server to request movies and shows.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.mehdi.towatchdb.title
            UTTypeDescription: ToWatchDB Title
            UTTypeConformsTo: [public.data]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: ToWatchDB/ToWatchDB.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehdi.towatchdb
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Theme-colored app icons the user can pick in Settings (iOS; macOS changes the Dock icon instead).
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]": AppIcon-Orange AppIcon-Yellow AppIcon-Green AppIcon-Teal AppIcon-Blue AppIcon-Indigo AppIcon-Purple AppIcon-Pink AppIcon-Graphite
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # The sandbox entitlements are macOS-only.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": ""
schemes:
  ToWatchDB:
    build:
      targets:
        ToWatchDB: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ToWatchCore/ToWatchCoreTests
